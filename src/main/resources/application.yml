quarkus:
  application:
    name: odm-platform-adapter-marketplace-executor-jira
  http:
    port: 9019
  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{3.} - %s%e%n"
  qute:
    strict-rendering: false
    property-not-found-strategy: noop
  smallrye-openapi:
    path: /api-docs
    info-title: ODM Platform Adapter Marketplace Executor Jira API
    info-description: API for fulfilling marketplace subscription and unsubscription requests through Jira issues and Jira Service Management requests, and for receiving Jira issue events
    info-version: v1.0.0
    info-license-name: Apache 2.0
    info-license-url: http://www.apache.org/licenses/LICENSE-2.0.html
  swagger-ui:
    always-include: true
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

# ODM configuration
odm:
  product-plane:
    marketplace-service:
      active: true
      address: http://localhost:8085
      result-delivery:
        max-attempts: 5
        backoff: 1s

# Jira configuration
jira:
  deployment: ${JIRA_DEPLOYMENT:CLOUD}
  site-url: ${JIRA_SITE_URL}
  api-url: ${JIRA_API_URL:}
  api-version: ${JIRA_API_VERSION:2}
  auth:
    type: ${JIRA_AUTH_TYPE:OAUTH2_CLIENT_CREDENTIALS}
    oauth2:
      client-id: ${JIRA_CLIENT_ID:}
      client-secret: ${JIRA_CLIENT_SECRET:}
    api-token:
      email: ${JIRA_API_TOKEN_EMAIL:}
      token: ${JIRA_API_TOKEN:}
    pat:
      token: ${JIRA_PAT:}
  correlation:
    field: ${JIRA_CORRELATION_FIELD}
  # Issue profiles (jira.profiles.subscribe / .unsubscribe) are intentionally NOT defined here:
  # Quarkus merges lists/maps across config sources, so packaged defaults would leak into your rules.
  # Provide them entirely in an external config/application.yml (see README "Basic scenarios").
  messages:
    pending: "{#if ticket.key}Jira issue {ticket.key} opened{#else}Request submitted to the Jira Automation rule{/if} for {operation} of {request.provider.dataProductFqn} (ports: {#each request.provider.dataProductPortsFqn}{it}{#if it_hasNext}, {/if}{/each}). Awaiting fulfilment{#if ticket.link}: {ticket.link}{/if}"
    fulfilled: "{outcome.status} through Jira issue {ticket.key} ({ticket.link}){#if ticket.closedBy} by {ticket.closedBy}{/if}: {fields.status}{#if fields.resolution} / {fields.resolution}{/if}.{#if fields.lastComment} Comment: {fields.lastComment}{/if}"
    refused: "Request refused on Jira: issue {ticket.key} ({ticket.link}){#if ticket.closedBy} by {ticket.closedBy}{/if}, {fields.status}{#if fields.resolution} / {fields.resolution}{/if}.{#if fields.lastComment} Reason: {fields.lastComment}{/if}"
    failed: "Jira issue {ticket.key} ({ticket.link}) was closed without a recognised resolution ({fields.status}{#if fields.resolution} / {fields.resolution}{/if}).{#if fields.lastComment} Details: {fields.lastComment}{/if}"
    technical-error: "Technical error while processing {operation} on Jira: {error.message}"
    closing-user:
      include: ${JIRA_MESSAGES_INCLUDE_CLOSING_USER:true}
      field: actor
